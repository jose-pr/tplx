site_name: tplx
site_description: Render a tree of templates with whichever engine each file's suffix names.
site_url: https://jose-pr.github.io/tplx/
repo_url: https://github.com/jose-pr/tplx
repo_name: jose-pr/tplx
edit_uri: edit/main/docs/

# Only docs/ is scanned: with pymdownx.snippets reading from the repository
# root, a strict build would otherwise warn about repo-level markdown that is
# not in the nav.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Command line: cli.md
  - API Reference:
      - Overview: api/reference.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
