[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license fields need 1.27
build-backend = "hatchling.build"

[project]
name = "tplx"
version = "0.2.1"
authors = [{ name = "jose-pr" }]
description = "Render a tree of templates with whichever engine each file's suffix names."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# One extra per engine library; each is imported only when a file needs it.
# 3.1.6: every earlier release has a published advisory, two of them escapes
# from the sandbox (CVE-2024-56201, CVE-2025-27516).
jinja = ["jinja2>=3.1.6,<4"]
# 1.3.12: earlier releases have published advisories (CVE-2022-40023,
# CVE-2026-44307).
mako = ["mako>=1.3.12,<2"]
# 2.2.1: earlier releases have published advisories, one an infinite loop on
# a malformed template (CVE-2026-55865).
liquid = ["python-liquid>=2.2.1,<3"]
# 0.9.1: the series has no 0.9.0 on PyPI.
handlebars = ["pybars3>=0.9.1,<0.10"]
mustache = ["chevron>=0.14.0,<0.15"]
cheetah = ["CT3>=3.4,<4"]
# gotpl needs Python 3.11; pre-1.0, so a minor may break.
go = ["gotpl>=0.1,<0.2; python_version >= '3.11'"]
# The `tplx` command line; importing tplx never needs it.
cli = ["duho>=0.7.8,<0.8"]
dev = [
    # Every engine extra, so their tests run rather than skip, within the
    # ranges a user gets.
    "tplx[cli,jinja,mako,liquid,handlebars,mustache,go,cheetah]",
    "black",
    "build",
    "pytest",
]
docs = [
    # MkDocs 2 drops the plugin system mkdocstrings needs.
    "mkdocs<2",
    "mkdocs-material",
    "mkdocstrings[python]",
    # 12.2 made Highlight(md) required; mkdocstrings 1.0.6 (the newest on 3.10) omits it.
    "pymdown-extensions<12.2; python_version < '3.11'",
]

[project.scripts]
tplx = "tplx.cli:main"

[project.urls]
Homepage = "https://github.com/jose-pr/tplx/"
Documentation = "https://jose-pr.github.io/tplx/"
Issues = "https://github.com/jose-pr/tplx/issues"

# Personal overrides (`*.local.*`) and agent config (`CLAUDE*`) never ship, even
# from a tree without its .gitignore (a copy, an sdist rebuild). Neither does the
# repo-root AGENTS.md: it orients a contributor in a checkout. The API header an
# installed consumer reads is src/tplx/AGENTS.md, which does ship.
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/AGENTS.md", "/benchmarks", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/tplx"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.black]
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # CT3 (the cheetah extra) imports cgi, deprecated on Python 3.11 and 3.12.
    "ignore:'cgi' is deprecated:DeprecationWarning",
]
